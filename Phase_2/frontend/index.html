<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        </div>
    </nav>
    <div class="container py-5">

        <!-- Page Title -->
        <h1 class="text-center mb-4">
            Expense Tracker
        </h1>


        <!-- Summary Cards -->
        <div class="summary-grid mb-5">

            <div class="summary-card">
                <h5>Total Amount</h5>
                <p id="total-amount">0.00</p>
            </div>

            <div class="summary-card">
                <h5>Number of Expenses</h5>
                <p id="expense-count">0</p>
            </div>

            <div class="summary-card">
                <h5>Highest Expense</h5>
                <p id="highest-expense">0.00</p>
            </div>

        </div>


        <!-- Add / Edit Expense Form -->
        <div class="card shadow-sm mb-5">

            <div class="card-body">

                <h3 class="mb-4">
                    Add Expense
                </h3>

                <form id="expense-form">

                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label">
                            Title
                        </label>

                        <input type="text" id="title" class="form-control" required>
                    </div>


                    <!-- Amount -->
                    <div class="mb-3">
                        <label for="amount" class="form-label">
                            Amount
                        </label>

                        <input type="number" id="amount" class="form-control" step="0.01" min="0.01" required>
                    </div>


                    <!-- Category -->
                    <div class="mb-3">
                        <label for="category" class="form-label">
                            Category
                        </label>

                        <select id="category" class="form-select" required>
                            <option value="">
                                Select category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Transport">
                                Transport
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Other">
                                Other
                            </option>
                        </select>
                    </div>


                    <!-- Date -->
                    <div class="mb-3">
                        <label for="date" class="form-label">
                            Date
                        </label>

                        <input type="date" id="date" class="form-control" required>
                    </div>


                    <!-- Buttons -->
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        Add Expense
                    </button>

                    <button type="button" class="btn btn-secondary d-none" id="cancel-btn">
                        Cancel
                    </button>

                </form>


                <!-- Loading Spinner -->
                <div id="loading" class="text-center mt-3 d-none">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">
                            Loading...
                        </span>
                    </div>
                </div>


                <!-- Messages -->
                <div id="message" class="mt-3"></div>

            </div>

        </div>


        <!-- Category Filter -->
        <div class="mb-4">

            <label for="category-filter" class="form-label">
                Filter by Category
            </label>

            <select id="category-filter" class="form-select">
                <option value="All">
                    All
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Transport">
                    Transport
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Other">
                    Other
                </option>
            </select>

        </div>


        <!-- Expenses Section -->
        <h3 class="mb-4">
            Expenses
        </h3>

        <!-- Expenses Table -->
        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="expenses-container">
                    <!-- Expenses will appear here -->
                </tbody>

            </table>
        </div>

    </div>

    <!-- Edit Expense Modal -->
    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="editExpenseModalLabel">
                        Edit Expense
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                </div>

                <div class="modal-body">

                    <form id="edit-expense-form">

                        <div class="mb-3">
                            <label for="edit-title" class="form-label">
                                Title
                            </label>

                            <input type="text" id="edit-title" class="form-control" required>
                        </div>


                        <div class="mb-3">
                            <label for="edit-amount" class="form-label">
                                Amount
                            </label>

                            <input type="number" id="edit-amount" class="form-control" step="0.01" min="0.01" required>
                        </div>


                        <div class="mb-3">
                            <label for="edit-category" class="form-label">
                                Category
                            </label>

                            <select id="edit-category" class="form-select" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">
                                    Entertainment
                                </option>
                                <option value="Other">Other</option>
                            </select>
                        </div>


                        <div class="mb-3">
                            <label for="edit-date" class="form-label">
                                Date
                            </label>

                            <input type="date" id="edit-date" class="form-control" required>
                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="submit" form="edit-expense-form" class="btn btn-primary">
                        Save Changes
                    </button>

                </div>

            </div>

        </div>
    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App JavaScript -->
    <script src="app.js"></script>
    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
